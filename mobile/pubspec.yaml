name: depannage_app
description: تطبيق ديباناج لخدمات القطر - الجزائر
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # الخرائط والموقع
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # الاتصالات
  socket_io_client: ^2.0.3
  http: ^1.1.0

  # إدارة الحالة والتخزين
  provider: ^6.0.5
  shared_preferences: ^2.2.0

  # التصميم والخطوط
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  shimmer: ^3.0.0

  # حقول الإدخال
  intl_phone_field: ^3.2.0
  pinput: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
